# Continuous integration (SPEC §10.5).
#
# GitHub runs this workflow on clean machines for every pull request and
# every push to main. If any step fails, the run turns red and the PR shows
# it. Jobs:
#   - changes: looks at the changed files and decides which jobs are needed.
#   - quality: format, analysis, unit and widget tests, coverage (Linux).
#   - integration-windows: integration tests in a real Windows window.
#   - e2e-android: integration and Patrol E2E tests on an Android emulator.
#
# To save CI minutes, a job that is not needed is skipped (a skipped job
# still counts as passed for a required check):
#   - Only documentation changed (`docs/`, `*.md`): nothing runs.
#   - Pull requests: quality always; integration-windows and e2e-android only
#     when something that can change how the app runs changed (see `app`
#     below), and only after quality passes.
#   - Push to main (a merged PR): quality only, as a safety net. The heavy
#     jobs already ran on the PR.
#   - "Run workflow" button in the Actions tab (workflow_dispatch): every
#     job, to force a full run on any branch.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The token every job gets can only read the repository: CI never needs to
# push, comment or change settings, so even a malicious change in a PR
# could not use it to modify the repository.
permissions:
  contents: read

# A new push to the same PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      windows: ${{ steps.filter.outputs.windows }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      # The whole history, so the change can be compared with its base.
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide which jobs this change needs
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          # A PR is compared with the commit it branches from; a push with
          # the commit main was on before.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash tool/ci_changes.sh "$EVENT" "$BASE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  quality:
    name: quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same version as the development machines, so lint results match.
          # Update it here when the team upgrades Flutter.
          flutter-version: 3.47.5
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Generated files (*.g.dart) are not committed, so build them first.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # UI string classes from the ARB files (pub get usually creates them
      # too; running it explicitly makes a broken ARB file fail here).
      - name: Generate UI strings
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage thresholds
        run: dart run tool/check_coverage.dart

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  integration-windows:
    name: integration-windows
    needs: [changes, quality]
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run integration tests on Windows
        run: flutter test integration_test -d windows

  e2e-android:
    name: e2e-android
    needs: [changes, quality]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # The Android build uses Java 17 (android/app/build.gradle.kts).
      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          # Reuse Gradle's downloads between runs.
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Pinned so a new CLI release cannot break CI unexpectedly.
      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli 4.8.0

      # The runner's disk is nearly full. The Android build may download the
      # NDK and CMake (several GB), and the emulator needs room for its data
      # partition, so this runs before both: a build that ran first once
      # filled the disk ("No space left on device"). Remove preinstalled
      # tools this project never uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /usr/local/share/chromium /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      # The project's gradle.properties lets Gradle use up to 8 GB of heap
      # plus 4 GB of metaspace, which is fine on a developer PC. Here the
      # runner has 16 GB for Gradle, the Dart compiler and the emulator
      # together: when Gradle built with the emulator running, the emulator
      # froze ("detected a hanging thread") and GitHub shut the runner down.
      # Settings in ~/.gradle/gradle.properties win over the project's, so
      # this lowers the limits on CI only.
      - name: Limit Gradle's memory
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m
          kotlin.daemon.jvmargs=-Xmx1g
          EOF

      # The Android build needs this NDK and CMake (the versions Flutter
      # asks for), which the runner does not have. Gradle downloads them
      # itself, but a broken download ("Error on ZipFile unknown archive")
      # once failed the whole build. Installing them here lets a bad
      # download be tried again.
      - name: Install the Android NDK and CMake
        run: |
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
              "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null && exit 0
            echo "Download failed (attempt $attempt), trying again"
          done
          exit 1

      # Do the heavy first Gradle build before the emulator starts. With the
      # emulator running too, the runner can run out of resources and the
      # emulator crashes; afterwards only a quick incremental build remains.
      - name: Build the Android app
        run: flutter build apk --debug

      # Hardware acceleration, so the emulator runs at usable speed.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Starts an emulator, runs the script on it and shuts it down.
      #
      # A green run takes about 12 minutes. The limit leaves room for the
      # retries below and still stops a stuck emulator before the job's own.
      - name: Run integration and E2E tests on an Android emulator
        timeout-minutes: 50
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The default renderer (`-gpu swiftshader_indirect`) logged graphics
          # errors ("Failed to find ColorBuffer") before those hangs. `guest`
          # draws inside the emulated system instead. The other options are
          # the action's defaults.
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # The emulator needs 1.8 times this size free on the runner's disk,
          # and the default does not fit. 2 GB is plenty for this app.
          disk-size: 2048M
          # Leaves memory for the Gradle build that runs next to it.
          ram-size: 2048M
          # Both test commands sometimes hang or stop on the CI emulator
          # while the same commit passes when run again: after installing
          # the app no test starts, or Patrol stops after its first test with
          # "Gradle test execution failed". An integration attempt gets 8
          # minutes (a green one takes about 4) and a Patrol attempt 15: the
          # E2E tests of phase 3 wait a real minute for the global timer, and
          # the first use of the system voice on a freshly booted emulator
          # once took minutes. A failed or stuck attempt is tried once more;
          # two failures in a row still fail the job. `--verbose` shows
          # Gradle's output in the log, to find the cause.
          script: |
            timeout 8m flutter test integration_test -d emulator-5554 || timeout 8m flutter test integration_test -d emulator-5554
            timeout 15m patrol test --device emulator-5554 --verbose || timeout 15m patrol test --device emulator-5554 --verbose

      # The Android test reports, kept when the tests fail so the cause can
      # be studied (they stay for a few days in the run's "Artifacts").
      - name: Upload the Android test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            build/app/outputs/androidTest-results
            build/app/reports/androidTests
          if-no-files-found: ignore
