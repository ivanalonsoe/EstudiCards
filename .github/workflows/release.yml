# Continuous delivery (SPEC §10.5, T6.7).
#
# Pushing a tag that starts with "v" builds the installers and publishes them
# in a GitHub Release:
#
#   git tag v1.0.0-rc.1 && git push origin v1.0.0-rc.1
#
# Jobs:
#   - version: checks the tag matches pubspec.yaml (tool/check_release_tag.dart).
#     A tag with a suffix after "-" (v1.0.0-rc.1) is published as a
#     pre-release.
#   - android: the APK, signed with the upload key (Linux).
#   - windows: an installer made with Inno Setup and a portable ZIP.
#   - macos: a DMG. Not signed by Apple: the Release notes explain how to
#     open it.
#   - release: creates the GitHub Release with the four files.
#
# The upload key and its password are secrets of the `release` environment,
# which only workflows started by a "v*" tag can read (Settings →
# Environments): a pull request cannot get them.
name: Release

on:
  push:
    tags: ['v*']

# Read-only by default; only the `release` job can write (to create the
# Release).
permissions:
  contents: read

# Two pushes of the same tag never publish at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check the tag matches the app version
        id: check
        run: dart run tool/check_release_tag.dart "$GITHUB_REF_NAME"

  android:
    name: android
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Gives this job the upload key's secrets.
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # The Android build uses Java 17 (android/app/build.gradle.kts).
      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Generated files (*.g.dart) are not committed, so build them first.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Installed here so a broken download can be tried again (see the
      # same step in ci.yml).
      - name: Install the Android NDK and CMake
        run: |
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
              "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null && exit 0
            echo "Download failed (attempt $attempt), trying again"
          done
          exit 1

      # The secret holds the key file as base64 text; it becomes a file only
      # for this build, in the runner's temporary folder, and is deleted at
      # the end of the job (the runner itself is thrown away too).
      - name: Write the upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      # build.gradle.kts signs with the key these variables point to.
      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --release

      # An APK signed with the debug key could never be updated by a later
      # release, so publishing one is an error.
      - name: Check the APK is signed with the upload key
        run: |
          ls "$ANDROID_HOME/build-tools"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          echo "Using $apksigner"
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee signer.txt
          if ! grep -q 'certificate DN' signer.txt; then
            echo "apksigner did not print the APK's certificate." >&2
            exit 1
          fi
          if grep -q 'Android Debug' signer.txt; then
            echo "The APK is signed with the debug key." >&2
            exit 1
          fi

      - name: Delete the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Name the APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/EstudiCards-$VERSION-android.apk"

      - name: Keep the APK for the release job
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/
          if-no-files-found: error

  windows:
    name: windows
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build the Windows app
        run: flutter build windows --release

      # A Flutter app needs these Visual C++ libraries, which a freshly
      # installed Windows may not have. Flutter's guide copies them next to
      # the app; the runner has them in System32.
      - name: Add the Visual C++ libraries
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\
          }

      - name: Make the portable ZIP
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "dist\EstudiCards-$env:VERSION-windows.zip"

      # Inno Setup turns the app folder into one installer (.exe).
      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Make the installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:VERSION" `
            "/DSourceDir=$PWD\build\windows\x64\runner\Release" `
            "/DOutputDir=$PWD\dist" `
            "/DOutputName=EstudiCards-$env:VERSION-windows-setup" `
            windows\installer\estudicards.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the Windows files for the release job
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  macos:
    name: macos
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Signed "to run locally" (ad hoc), not by Apple: the Release notes
      # explain how to open it the first time.
      - name: Build the macOS app
        run: flutter build macos --release

      # A disk image with the app and a shortcut to Applications, to drag it
      # there. hdiutil comes with macOS.
      - name: Make the DMG
        run: |
          mkdir -p dmg dist
          cp -R build/macos/Build/Products/Release/*.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname EstudiCards -srcfolder dmg -ov -format UDZO \
            "dist/EstudiCards-$VERSION-macos.dmg"

      - name: Keep the DMG for the release job
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/
          if-no-files-found: error

  release:
    name: release
    needs: [version, android, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can write to the repository: it creates the Release.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      # For the Release notes (.github/release_notes.md).
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Get the installers
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The notes say how to install; GitHub adds the list of merged PRs.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "EstudiCards $VERSION" \
            --notes-file .github/release_notes.md \
            --generate-notes \
            "${flags[@]}"
